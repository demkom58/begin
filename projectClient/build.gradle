apply plugin: "application"

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

mainClassName = "net.minecraft.client.Minecraft"

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {
	implementation project(":projectCommon")

	compile group: 'com.github.cliftonlabs', name: 'json-simple', version: '3.1.0'
	compile group: 'org.lwjgl.lwjgl', name: 'lwjgl', version: '2.9.3'
	compile group: 'net.java.jinput', name: 'jinput', version: '2.0.9'
	implementation 'com.github.divinacode:Paulscode-SoundSystem:2013-04-17'
}