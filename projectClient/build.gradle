apply plugin: "application"

mainClassName = "net.minecraft.client.Minecraft"

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
}

project.ext.lwjglVersion = "3.2.4-SNAPSHOT"
project.ext.jomlVersion = "1.9.17"
project.ext.lwjglNatives = "natives-windows"

dependencies {
	implementation project(":projectCommon")

    compile group: 'org.jetbrains', name: 'annotations', version: '17.0.0'
    compile group: 'com.github.cliftonlabs', name: 'json-simple', version: '3.1.0'

    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-openal:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-stb:${lwjglVersion}"

    implementation "org.joml:joml:${jomlVersion}"
}